name: Feature request
description: An idea for something the app should do, or do better.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Describing what you want to get done helps more than a finished design.
  - type: textarea
    id: goal
    attributes:
      label: What would you like to do?
      description: What you want to get done that the app doesn't support today, or makes hard.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: Your workaround, if you have one.
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Your idea, an example, or how another app does it. Screenshots or sketches help; drag them in here.
  - type: dropdown
    id: frequency
    attributes:
      label: How often would you use it?
      options:
        - Several times a day
        - Daily
        - Weekly
        - Rarely
  - type: input
    id: version
    attributes:
      label: App version
      description: Help ▸ About in the app.
      placeholder: "2.3.5"
