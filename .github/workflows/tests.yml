name: Tests

# The test suite on every push to main and on pull requests (Dependabot's included), so an update is never merged
# untested. Releases run the same suite again in release.yml.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "design/**", "**/*.md"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Tests
        shell: pwsh
        run: ./tests/run-tests.ps1
