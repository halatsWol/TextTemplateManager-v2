name: Release

# Tests, then the x64 Store package and the manuals; on a version tag also the GitHub release and the Store submission.
#
#   - Push an annotated tag like v2.0.1 -> build, create a draft GitHub release (manuals, notes from releases/vX.Y.Z/en-US), then
#     submit the package to the Microsoft Store; publish-when-live.yml publishes the release once the Store has it live.
#   - Run manually (workflow_dispatch) -> build and upload the files as artifacts ONLY (never publishes), or, with
#     "Check Store access", only sign in to Partner Center and read the app (no build, nothing submitted), or, with
#     "Commit the pending Store submission", commit a submission left by "publish: draft".
#
# The Store submission is controlled by the annotated tag's message: "publish: none" skips it, "publish: draft"
# uploads the package and sets "What's new" but doesn't commit (Partner Center shows the package only after the
# commit, so commit with the manual run, not Submit in Partner Center), "publish: store" or no such line submits.
# The submission jobs wait for the "store-release" environment, so they go out only after a manual approval
# (Settings > Environments). See docs/PUBLISHING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (X.Y.Z); nothing is published"
        default: "0.0.1"
      check_store_access:
        description: "Only check the Store access (sign-in and the app in Partner Center); no build"
        type: boolean
        default: false
      commit_store_submission:
        description: "Only commit the pending Store submission (left by 'publish: draft'); certification starts"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  store-access:
    if: github.event_name == 'workflow_dispatch' && inputs.check_store_access
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check access to the app in Partner Center
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: ./build/Store-Api.ps1 -AppId 9NMBSZLLLN6V -Check

  store-commit:
    if: github.event_name == 'workflow_dispatch' && inputs.commit_store_submission && !inputs.check_store_access
    runs-on: windows-latest
    environment: store-release
    steps:
      - uses: actions/checkout@v5

      # The check lists the pending submission's packages first, for the log.
      - name: Commit the pending submission
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: ./build/Store-Api.ps1 -AppId 9NMBSZLLLN6V -Check -Commit

  # After a committed submission: the watcher publishes the newest draft GitHub release once its version is live.
  publish-when-live-after-commit:
    needs: store-commit
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the watcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-when-live.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

  package:
    if: github.event_name != 'workflow_dispatch' || !(inputs.check_store_access || inputs.commit_store_submission)
    runs-on: windows-latest
    outputs:
      store_mode: ${{ steps.targets.outputs.store_mode }}
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: ver
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}   # through the environment, never pasted into the script
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME -replace '^v', '' } else { $env:INPUT_VERSION }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "'$v' is not X.Y.Z: the Store takes plain numeric versions only (no beta tags)." }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building $v"

      # The message lives in the annotated tag object, which actions/checkout doesn't fetch: read it from the API,
      # which also tells an annotated tag from a lightweight one (no message: submit).
      - name: Store submission from the tag message
        id: targets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:GITHUB_REF_NAME" | ConvertFrom-Json
          $msg = if ($ref.object.type -eq 'tag') { gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($ref.object.sha)" --jq '.message' | Out-String } else { '' }
          $line = @($msg -split "\r?\n" | Where-Object { $_ -match '^\s*publish\s*:' }) | Select-Object -Last 1
          $target = if ($line) { ($line -replace '^\s*publish\s*:\s*', '').Trim().ToLowerInvariant() } else { 'store' }
          $mode = switch ($target) { { $_ -in 'store', 'all', '' } { 'store' } 'draft' { 'draft' } { $_ -in 'none', 'skip' } { 'none' } default { throw "Unknown 'publish: $target' in the tag message (store, draft or none)." } }
          "store_mode=$mode" >> $env:GITHUB_OUTPUT
          Write-Host "Store submission: $mode"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Tests
        shell: pwsh
        run: ./tests/run-tests.ps1

      - name: Store package and manuals
        shell: pwsh
        run: ./build/Build-Release.ps1 -Version ${{ steps.ver.outputs.version }} -OutDir dist

      - name: Release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $changelog = ''
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $json = gh api -X POST "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$env:GITHUB_REF_NAME" 2>$null
            if ($LASTEXITCODE -eq 0 -and $json) { $changelog = ($json | ConvertFrom-Json).body }
          }
          ./build/Release-Notes.ps1 -Version ${{ steps.ver.outputs.version }} -Changelog $changelog `
            -GitHubOut release-notes.md -StoreOutDir dist/store-notes
          Write-Host '----- GitHub release notes -----'; Get-Content release-notes.md
          foreach ($f in Get-ChildItem dist/store-notes -Filter *.txt) { Write-Host "----- Store ""What's new"" ($($f.BaseName)) -----"; Get-Content $f.FullName }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: TextTemplateManager-${{ steps.ver.outputs.version }}
          path: |
            dist/*
            release-notes.md
          if-no-files-found: error

      - name: Upload the Store submission files
        uses: actions/upload-artifact@v7
        with:
          name: store-submission
          path: |
            dist/*.msixupload
            dist/store-notes/*.txt
          if-no-files-found: error

      # A draft, published once the Store has the version live (publish-when-live.yml); 2.x is updated through the
      # Store, nothing reads these releases for updates. Only the manuals are attached; no installers, never an .exe.
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @('dist/TextTemplateManager-Manual.pdf', 'dist/TextTemplateManager-AdminManual.pdf')
          if ($assets | Where-Object { $_ -like '*.exe' }) { throw 'An .exe among the release assets.' }
          gh release create $env:GITHUB_REF_NAME @assets --draft --title $env:GITHUB_REF_NAME --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { gh release upload $env:GITHUB_REF_NAME @assets --clobber; if ($LASTEXITCODE -ne 0) { throw 'release upload failed' } }

  microsoft-store:
    needs: package
    if: startsWith(github.ref, 'refs/tags/') && needs.package.outputs.store_mode != 'none'
    runs-on: windows-latest
    environment: store-release
    env:
      STORE_PRODUCT_ID: 9NMBSZLLLN6V   # public (the Store link); not a secret
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: store-submission
          path: store

      # Fails with the real reason (sign-in, missing secret, the Entra app's role or access) before anything is uploaded.
      - name: Check access to the app in Partner Center
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: ./build/Store-Api.ps1 -AppId $env:STORE_PRODUCT_ID -Check

      # Pinned: the command below follows this version's syntax (publish takes the package file).
      - name: Set up the Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4
        with:
          version: v0.4.3

      - name: Sign in to Partner Center
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSSTORE_SELLER_ID)) { throw 'Missing MSSTORE_SELLER_ID (see docs/PUBLISHING.md).' }
          msstore reconfigure --tenantId $env:MSSTORE_TENANT_ID --sellerId $env:MSSTORE_SELLER_ID `
            --clientId $env:MSSTORE_CLIENT_ID --clientSecret $env:MSSTORE_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw 'msstore reconfigure failed' }

      # msstore uploads the package (to the blob store the submission names) into a pending submission, which it
      # creates from the last published one; it doesn't commit. A built package is published by passing the
      # .msixupload itself; -i would be the folder of a project's packages.
      - name: Upload the package to a draft submission
        shell: pwsh
        run: |
          $upload = Get-ChildItem store -Filter *.msixupload | Select-Object -First 1
          if (-not $upload) { throw 'No .msixupload in the store-submission artifact.' }
          msstore publish $upload.FullName -id $env:STORE_PRODUCT_ID --noCommit
          if ($LASTEXITCODE -ne 0) { throw 'msstore publish failed' }

      - name: Set "What's new"
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: ./build/Store-Api.ps1 -AppId $env:STORE_PRODUCT_ID -ReleaseNotesDir store/store-notes

      # Certification takes hours to days; the job ends once the commit has been accepted.
      - name: Commit the submission
        if: needs.package.outputs.store_mode == 'store'
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: ./build/Store-Api.ps1 -AppId $env:STORE_PRODUCT_ID -Commit

      - name: Draft left for review
        if: needs.package.outputs.store_mode == 'draft'
        shell: pwsh
        run: |
          $text = "The submission is uploaded but not committed (publish: draft). Partner Center shows the new package only after the commit, so don't use Submit there: commit with Actions > Release > Run workflow > 'Commit the pending Store submission'. That run also starts the watcher that publishes the GitHub release."
          Write-Host $text
          "### Store submission left as a draft`n`n$text" >> $env:GITHUB_STEP_SUMMARY

  # The draft GitHub release goes public once the Store has the version live; the watcher waits for that (up to 7 days).
  publish-when-live:
    needs: [package, microsoft-store]
    if: needs.package.outputs.store_mode == 'store'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the watcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-when-live.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f tag="$GITHUB_REF_NAME"
