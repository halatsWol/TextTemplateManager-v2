<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="845px" preserveAspectRatio="none" style="width:1376px;height:845px;background:#FFFFFF;" version="1.1" viewBox="0 0 1376 845" width="1376px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="518" x="422" y="25.1074">Quick Paste keyboard focus and input (PasteWindow + QuickPasteController)</text><ellipse cx="620" cy="55.6211" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><g id="ShortcutMode"><rect fill="#F1F1F1" height="99.8047" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="265" x="487.5" y="142.6211"/><line style="stroke:#181818;stroke-width:0.5;" x1="487.5" x2="752.5" y1="184.543" y2="184.543"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="79" x="580.5" y="160.5703">Shortcut mode</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="99" x="570.5" y="176.5313">(root grid focused)</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="245" x="492.5" y="202.4922">letter/digit -&gt; SingleKey -&gt; paste, or error tone</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="193" x="492.5" y="218.4531">Up/Down -&gt; move highlight (wraps)</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="200" x="492.5" y="234.4141">Enter -&gt; CommitHighlighted -&gt; paste</text></g><g id="Search"><rect fill="#F1F1F1" height="67.8828" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="239" x="499.5" y="319.4311"/><line style="stroke:#181818;stroke-width:0.5;" x1="499.5" x2="738.5" y1="345.392" y2="345.392"/><text fill="#000000" font-family="