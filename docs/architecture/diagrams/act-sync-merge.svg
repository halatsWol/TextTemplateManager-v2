<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="884px" preserveAspectRatio="none" style="width:999px;height:884px;background:#FFFFFF;" version="1.1" viewBox="0 0 999 884" width="999px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="278" x="359.25" y="35.1074">SyncEngine.Merge: one item of a sync file</text><ellipse cx="580.25" cy="59.6211" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="35.9609" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="200" x="480.25" y="89.6211"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="180" x="490.25" y="112.5703">file item (Id = its SyncId in the file)</text><polygon fill="#F1F1F1" points="501.25,145.582,659.25,145.582,671.25,157.582,659.25,169.582,501.25,169.582,489.25,157.582,501.25,145.582" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="158" x="501.25" y="162.5508">cached item with that SyncId?</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="17" x="472.25" y="154.5703">yes</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="14" x="671.25" y="154.5703">no</text><rect fill="#F1F1F1" height="51.9219" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="236" x="172" y="179.582"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="125" x="182" y="202.5313">reuse the cached object</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="216" x="182" y="218.4922">(keeps tree identity: expansion, selection)</text><polygon fill="#F1F1F1" points="129.5,251.5039,450.5,251.5039,462.5,263.5039,450.5,275.5039,129.5,275.5039,117.5,263.5039,129.5,251.5039" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="321" x="129.5" y="268.4727">source.AllowSave and cached.LastChange &gt; file.LastChange?</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="17" x="100.5" y="260.4922">yes</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="14" x="462.5" y="260.4922">no</text><rect fill="#F1F1F1" height="51.9219" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="193" x="11" y="285.5039"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="130" x="21" y="308.4531">keep the cached content</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="173" x="21" y="324.4141">(a local edit not written back yet)</text><polygon fill="#F1F1F1" points="389,285.5039,556,285.5039,568,301.4648,556,317.4258,389,317.4258,377,301.4648,389,285.5039" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="167" x="389" y="298.4531">file item has no language fields,</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="146" x="389" y="314.4141">cached template has some?</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="17" x="360" y="298.4531">yes</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="14" x="568" y="298.4531">no</text><rect fill="#F1F1F1" height="67.8828" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="191" x="255.5" y="327.4258"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="139" x="265.5" y="350.375">copy the rest from the file,</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="143" x="265.5" y="366.3359">keep the cached languages</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="171" x="265.5" y="382.2969">(an older version dropped them)</text><rect fill="#F1F1F1" height="51.9219" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="209" x="246.5" y="415.3086"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="189" x="256.5" y="438.2578">LanguagesKeptLocally: written back</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="161" x="256.5" y="454.2188">without them until edited here</text><rect fill="#F1F1F1" height="67.8828" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="237" x="475.5" y="327.4258"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="127" x="485.5" y="350.375">copy title, content, tags,</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="180" x="485.5" y="366.3359">shortcuts, paste mode, languages,</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="217" x="485.5" y="382.2969">LastChange, unknown fields from the file</text><polygon fill="#F1F1F1" points="472.5,473.2305,484.5,485.2305,472.5,497.2305,460.5,485.2305,472.5,473.2305" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="290,503.2305,302,515.2305,290,527.2305,278,515.2305,290,503.2305" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="51.9219" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="236" x="752.5" y="179.582"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="216" x="762.5" y="202.5313">new Template/Folder with a fresh app Id,</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="109" x="762.5" y="218.4922">content from the file</text><polygon fill="#F1F1F1" points="580.25,533.2305,592.25,545.2305,580.25,557.2305,568.25,545.2305,580.25,533.2305" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="35.9609" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="133" x="513.75" y="577.2305"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="113" x="523.75" y="600.1797">SyncId = file item's Id</text><rect fill="#F1F1F1" height="35.9609" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="190" x="485.25" y="633.1914"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="170" x="495.25" y="656.1406">merge its children the same way</text><rect fill="#F1F1F1" height="67.8828" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="274" x="443.25" y="689.1523"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="254" x="453.25" y="712.1016">SyncChildren: remove items no longer in the file</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="205" x="453.25" y="728.0625">(except local additions not written yet),</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="210" x="453.25" y="744.0234">insert new ones, move to the file's order</text><path d="M611.25,767.0352 L611.25,815.918 L591.25,819.918 L611.25,823.918 L611.25,872.8008 A0,0 0 0 0 611.25,872.8008 L918.25,872.8008 A0,0 0 0 0 918.25,872.8008 L918.25,777.0352 L908.25,767.0352 L611.25,767.0352 A0,0 0 0 0 611.25,767.0352 " fill="#FFF8DC" style="stroke:#C8B560;stroke-width:0.5;"/><path d="M908.25,767.0352 L908.25,777.0352 L918.25,777.0352 L908.25,767.0352 " fill="#FFF8DC" style="stroke:#C8B560;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="278" x="617.25" y="784.9844">The folder root adopts the file root's LastChange and</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="108" x="617.25" y="800.9453">unknown fields, so a</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="267" x="617.25" y="816.9063">read-only open re-serializes identically and doesn't</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="251" x="617.25" y="832.8672">churn the shared file (OneDrive conflict copies).</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="286" x="617.25" y="848.8281">Write-back: BuildFileTree writes items keyed by SyncId</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="278" x="617.25" y="864.7891">(new local items get a fresh SyncId), root title "Root".</text><ellipse cx="580.25" cy="819.918" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="580.25" cy="819.918" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="580.25" x2="580.25" y1="69.6211" y2="89.6211"/><polygon fill="#444444" points="576.25,79.6211,580.25,89.6211,584.25,79.6211,580.25,83.6211" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="351" x2="351" y1="395.3086" y2="415.3086"/><polygon fill="#444444" points="347,405.3086,351,415.3086,355,405.3086,351,409.3086" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="377" x2="351" y1="301.4648" y2="301.4648"/><line style="stroke:#444444;stroke-width:1.0;" x1="351" x2="351" y1="301.4648" y2="327.4258"/><polygon fill="#444444" points="347,317.4258,351,327.4258,355,317.4258,351,321.4258" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="568" x2="594" y1="301.4648" y2="301.4648"/><line style="stroke:#444444;stroke-width:1.0;" x1="594" x2="594" y1="301.4648" y2="327.4258"/><polygon fill="#444444" points="590,317.4258,594,327.4258,598,317.4258,594,321.4258" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="351" x2="351" y1="467.2305" y2="485.2305"/><line style="stroke:#444444;stroke-width:1.0;" x1="351" x2="460.5" y1="485.2305" y2="485.2305"/><polygon fill="#444444" points="450.5,481.2305,460.5,485.2305,450.5,489.2305,454.5,485.2305" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="594" x2="594" y1="395.3086" y2="485.2305"/><line style="stroke:#444444;stroke-width:1.0;" x1="594" x2="484.5" y1="485.2305" y2="485.2305"/><polygon fill="#444444" points="494.5,481.2305,484.5,485.2305,494.5,489.2305,490.5,485.2305" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="117.5" x2="107.5" y1="263.5039" y2="263.5039"/><line style="stroke:#444444;stroke-width:1.0;" x1="107.5" x2="107.5" y1="263.5039" y2="285.5039"/><polygon fill="#444444" points="103.5,275.5039,107.5,285.5039,111.5,275.5039,107.5,279.5039" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="462.5" x2="472.5" y1="263.5039" y2="263.5039"/><line style="stroke:#444444;stroke-width:1.0;" x1="472.5" x2="472.5" y1="263.5039" y2="285.5039"/><polygon fill="#444444" points="468.5,275.5039,472.5,285.5039,476.5,275.5039,472.5,279.5039" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="107.5" x2="107.5" y1="337.4258" y2="515.2305"/><line style="stroke:#444444;stroke-width:1.0;" x1="107.5" x2="278" y1="515.2305" y2="515.2305"/><polygon fill="#444444" points="268,511.2305,278,515.2305,268,519.2305,272,515.2305" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="472.5" x2="472.5" y1="497.2305" y2="515.2305"/><line style="stroke:#444444;stroke-width:1.0;" x1="472.5" x2="302" y1="515.2305" y2="515.2305"/><polygon fill="#444444" points="312,511.2305,302,515.2305,312,519.2305,308,515.2305" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="290" x2="290" y1="231.5039" y2="251.5039"/><polygon fill="#444444" points="286,241.5039,290,251.5039,294,241.5039,290,245.5039" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="489.25" x2="290" y1="157.582" y2="157.582"/><line style="stroke:#444444;stroke-width:1.0;" x1="290" x2="290" y1="157.582" y2="179.582"/><polygon fill="#444444" points="286,169.582,290,179.582,294,169.582,290,173.582" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="671.25" x2="870.5" y1="157.582" y2="157.582"/><line style="stroke:#444444;stroke-width:1.0;" x1="870.5" x2="870.5" y1="157.582" y2="179.582"/><polygon fill="#444444" points="866.5,169.582,870.5,179.582,874.5,169.582,870.5,173.582" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="290" x2="290" y1="527.2305" y2="545.2305"/><line style="stroke:#444444;stroke-width:1.0;" x1="290" x2="568.25" y1="545.2305" y2="545.2305"/><polygon fill="#444444" points="558.25,541.2305,568.25,545.2305,558.25,549.2305,562.25,545.2305" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="870.5" x2="870.5" y1="231.5039" y2="545.2305"/><line style="stroke:#444444;stroke-width:1.0;" x1="870.5" x2="592.25" y1="545.2305" y2="545.2305"/><polygon fill="#444444" points="602.25,541.2305,592.25,545.2305,602.25,549.2305,598.25,545.2305" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="580.25" x2="580.25" y1="125.582" y2="145.582"/><polygon fill="#444444" points="576.25,135.582,580.25,145.582,584.25,135.582,580.25,139.582" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="580.25" x2="580.25" y1="557.2305" y2="577.2305"/><polygon fill="#444444" points="576.25,567.2305,580.25,577.2305,584.25,567.2305,580.25,571.2305" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="580.25" x2="580.25" y1="613.1914" y2="633.1914"/><polygon fill="#444444" points="576.25,623.1914,580.25,633.1914,584.25,623.1914,580.25,627.1914" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="580.25" x2="580.25" y1="669.1523" y2="689.1523"/><polygon fill="#444444" points="576.25,679.1523,580.25,689.1523,584.25,679.1523,580.25,683.1523" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="580.25" x2="580.25" y1="757.0352" y2="808.918"/><polygon fill="#444444" points="576.25,798.918,580.25,808.918,584.25,798.918,580.25,802.918" style="stroke:#444444;stroke-width:1.0;"/><!--SRC=[RLJ1Rjim3BtxAxXUcW1fTdVG3Lkt0iKw35WBx19WK2qcrYABXYGtzRv-JvAJ9iLEbYtoyV4zqk-CQ-oWcNw7E5fUcg6pLJJHCZsChldgjiRnyZlxBTSaZib4xaWsf2ZWdZR6SbM5g7oiwlHI0cPtcgvn31a5ByPHR3c7prULsT2iKKtBkeJlJMnnh-8K_d6UeXtDHWxpYgZsF0JE25EQFFtX9gxTRCVS1ugUKLcp0_Mn9dxfbGj6t882MmJYYB94gN2GmJUy_6Ijx1_KCvDoUe9TtgiGRrhbjamVCjcJBsz9WLOgVigg4HV10RGKMMcK9TOcafD8UsyYxkX9DJiQEMOwRD7Lp4c1I-HU9MnLG29Pb1xKDad7LeV5sasr4DDR5Ja71kd-mmyC6-d7pD1pYBJnqXrz0DHR_eTY8NNWIAncJy_iavIalVHzAjnobzdd0lU7b6_Sn_lKiuK1fzskNR9NXfWpQO17HHTWjUovG9rBSMIU9d5nq7L1KMsJ1A4L7viXXWNry8Uf4usm8ts4lFgsGCcTaxsR93nNOQhkjDbKX-SfbzhndXudhT_V5adol2e0SS2px-bE9sCAoxVu1REU5k6QZXPV1kIjghfBsvMNfMcDrPxBhWJLCUtLk2gvDzDT3IixUIuGPKG4NVhJ5ODz_DB0a6aAbORSy32SZMAQGj0sBh37aA9FB3WapUXHZcZWAHvjhx3dqbU0m3YPRHiXpsEAAQ9u0RRIqgEHGsh-YFoJlSAs8U_S4gofaC9dpqfVYRCZIG-6dg_0pIXh_dAOzZjFMDvPBHpSPMBHj8EVH6kLnrpbshCVZhzuWsRWpCQQ9kBG6sp74Zc_e09VfG6jwVC0RM-HyvZ-8qcVL2xhk-CHU4_Zz6T2uYmfLNGj8LkEns4eKVD5KQFyI2z-udonJ8EGzET_]--></g></svg>