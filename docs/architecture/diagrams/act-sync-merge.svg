<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="740px" preserveAspectRatio="none" style="width:857px;height:740px;background:#FFFFFF;" version="1.1" viewBox="0 0 857 740" width="857px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="278" x="288.125" y="35.1074">SyncEngine.Merge: one item of a sync file</text><ellipse cx="507.25" cy="59.6211" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="35.9609" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="200" x="407.25" y="89.6211"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="180" x="417.25" y="112.5703">file item (Id = its SyncId in the file)</text><polygon fill="#F1F1F1" points="428.25,145.582,586.25,145.582,598.25,157.582,586.25,169.582,428.25,169.582,416.25,157.582,428.25,145.582" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="158" x="428.25" y="162.5508">cached item with that SyncId?</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="17" x="399.25" y="154.5703">yes</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="14" x="598.25" y="154.5703">no</text><rect fill="#F1F1F1" height="51.9219" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="236" x="172" y="179.582"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="125" x="182" y="202.5313">reuse the cached object</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="216" x="182" y="218.4922">(keeps tree identity: expansion, selection)</text><polygon fill="#F1F1F1" points="129.5,251.5039,450.5,251.5039,462.5,263.5039,450.5,275.5039,129.5,275.5039,117.5,263.5039,129.5,251.5039" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="321" x="129.5" y="268.4727">source.AllowSave and cached.LastChange &gt; file.LastChange?</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="17" x="100.5" y="260.4922">yes</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="14" x="462.5" y="260.4922">no</text><rect fill="#F1F1F1" height="51.9219" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="193" x="11" y="285.5039"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="130" x="21" y="308.4531">keep the cached content</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="173" x="21" y="324.4141">(a local edit not written back yet)</text><rect fill="#F1F1F1" height="67.8828" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="208" x="368.5" y="285.5039"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="127" x="378.5" y="308.4531">copy title, content, tags,</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="188" x="378.5" y="324.4141">shortcuts, paste mode, LastChange,</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="149" x="378.5" y="340.375">unknown fields from the file</text><polygon fill="#F1F1F1" points="290,359.3867,302,371.3867,290,383.3867,278,371.3867,290,359.3867" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="51.9219" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="236" x="606.5" y="179.582"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="216" x="616.5" y="202.5313">new Template/Folder with a fresh app Id,</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="109" x="616.5" y="218.4922">content from the file</text><polygon fill="#F1F1F1" points="507.25,389.3867,519.25,401.3867,507.25,413.3867,495.25,401.3867,507.25,389.3867" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="35.9609" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="133" x="440.75" y="433.3867"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="113" x="450.75" y="456.3359">SyncId = file item's Id</text><rect fill="#F1F1F1" height="35.9609" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="190" x="412.25" y="489.3477"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="170" x="422.25" y="512.2969">merge its children the same way</text><rect fill="#F1F1F1" height="67.8828" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="274" x="370.25" y="545.3086"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="254" x="380.25" y="568.2578">SyncChildren: remove items no longer in the file</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="205" x="380.25" y="584.2188">(except local additions not written yet),</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="210" x="380.25" y="600.1797">insert new ones, move to the file's order</text><path d="M538.25,623.1914 L538.25,672.0742 L518.25,676.0742 L538.25,680.0742 L538.25,728.957 A0,0 0 0 0 538.25,728.957 L845.25,728.957 A0,0 0 0 0 845.25,728.957 L845.25,633.1914 L835.25,623.1914 L538.25,623.1914 A0,0 0 0 0 538.25,623.1914 " fill="#FFF8DC" style="stroke:#C8B560;stroke-width:0.5;"/><path d="M835.25,623.1914 L835.25,633.1914 L845.25,633.1914 L835.25,623.1914 " fill="#FFF8DC" style="stroke:#C8B560;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="278" x="544.25" y="641.1406">The folder root adopts the file root's LastChange and</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="108" x="544.25" y="657.1016">unknown fields, so a</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="267" x="544.25" y="673.0625">read-only open re-serializes identically and doesn't</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="251" x="544.25" y="689.0234">churn the shared file (OneDrive conflict copies).</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="286" x="544.25" y="704.9844">Write-back: BuildFileTree writes items keyed by SyncId</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="278" x="544.25" y="720.9453">(new local items get a fresh SyncId), root title "Root".</text><ellipse cx="507.25" cy="676.0742" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="507.25" cy="676.0742" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="507.25" x2="507.25" y1="69.6211" y2="89.6211"/><polygon fill="#444444" points="503.25,79.6211,507.25,89.6211,511.25,79.6211,507.25,83.6211" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="117.5" x2="107.5" y1="263.5039" y2="263.5039"/><line style="stroke:#444444;stroke-width:1.0;" x1="107.5" x2="107.5" y1="263.5039" y2="285.5039"/><polygon fill="#444444" points="103.5,275.5039,107.5,285.5039,111.5,275.5039,107.5,279.5039" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="462.5" x2="472.5" y1="263.5039" y2="263.5039"/><line style="stroke:#444444;stroke-width:1.0;" x1="472.5" x2="472.5" y1="263.5039" y2="285.5039"/><polygon fill="#444444" points="468.5,275.5039,472.5,285.5039,476.5,275.5039,472.5,279.5039" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="107.5" x2="107.5" y1="337.4258" y2="371.3867"/><line style="stroke:#444444;stroke-width:1.0;" x1="107.5" x2="278" y1="371.3867" y2="371.3867"/><polygon fill="#444444" points="268,367.3867,278,371.3867,268,375.3867,272,371.3867" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="472.5" x2="472.5" y1="353.3867" y2="371.3867"/><line style="stroke:#444444;stroke-width:1.0;" x1="472.5" x2="302" y1="371.3867" y2="371.3867"/><polygon fill="#444444" points="312,367.3867,302,371.3867,312,375.3867,308,371.3867" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="290" x2="290" y1="231.5039" y2="251.5039"/><polygon fill="#444444" points="286,241.5039,290,251.5039,294,241.5039,290,245.5039" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="416.25" x2="290" y1="157.582" y2="157.582"/><line style="stroke:#444444;stroke-width:1.0;" x1="290" x2="290" y1="157.582" y2="179.582"/><polygon fill="#444444" points="286,169.582,290,179.582,294,169.582,290,173.582" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="598.25" x2="724.5" y1="157.582" y2="157.582"/><line style="stroke:#444444;stroke-width:1.0;" x1="724.5" x2="724.5" y1="157.582" y2="179.582"/><polygon fill="#444444" points="720.5,169.582,724.5,179.582,728.5,169.582,724.5,173.582" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="290" x2="290" y1="383.3867" y2="401.3867"/><line style="stroke:#444444;stroke-width:1.0;" x1="290" x2="495.25" y1="401.3867" y2="401.3867"/><polygon fill="#444444" points="485.25,397.3867,495.25,401.3867,485.25,405.3867,489.25,401.3867" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="724.5" x2="724.5" y1="231.5039" y2="401.3867"/><line style="stroke:#444444;stroke-width:1.0;" x1="724.5" x2="519.25" y1="401.3867" y2="401.3867"/><polygon fill="#444444" points="529.25,397.3867,519.25,401.3867,529.25,405.3867,525.25,401.3867" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="507.25" x2="507.25" y1="125.582" y2="145.582"/><polygon fill="#444444" points="503.25,135.582,507.25,145.582,511.25,135.582,507.25,139.582" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="507.25" x2="507.25" y1="413.3867" y2="433.3867"/><polygon fill="#444444" points="503.25,423.3867,507.25,433.3867,511.25,423.3867,507.25,427.3867" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="507.25" x2="507.25" y1="469.3477" y2="489.3477"/><polygon fill="#444444" points="503.25,479.3477,507.25,489.3477,511.25,479.3477,507.25,483.3477" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="507.25" x2="507.25" y1="525.3086" y2="545.3086"/><polygon fill="#444444" points="503.25,535.3086,507.25,545.3086,511.25,535.3086,507.25,539.3086" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="507.25" x2="507.25" y1="613.1914" y2="665.0742"/><polygon fill="#444444" points="503.25,655.0742,507.25,665.0742,511.25,655.0742,507.25,659.0742" style="stroke:#444444;stroke-width:1.0;"/><!--SRC=[NLH1Rjim4Bph5TjS8WEsUvUH5ctQ005Q56WCz1AWeCcrnPfQ2YGLHtrzXwBYEZcP4cTdPsT7VcT5ky4m_OvfTBosG-UgP9DZUXX5VvM35Lv_vt3WXhmmsSGT-JqfYhYdlNLSLJ6faAecFnH0VM_e1iSuiU312gMM9_XYKzazrLhfbas1dsngSQ_I3F-uo6YXUkIug8YQm4FaYM4kyxi_hDEZr4VcFb8AZCw61TB7XlYvLnAjboL5TW3YYBP4kN7qGz2y_kISFpse9oObPgPTVrCntRPA3amV9h4NRzwAWgpS_5ALzfAW0R8KEQ-L8pOsaVX4fs0JxcYdz956JfCSTfYg5Z_JQT-FD9c_VA5QKbA7k7oKsFgGz93Yadf8Okgy0Uo_F606EOe_2OIpCv7smNTdrwTsO