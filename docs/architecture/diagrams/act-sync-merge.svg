<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="724px" preserveAspectRatio="none" style="width:857px;height:724px;background:#FFFFFF;" version="1.1" viewBox="0 0 857 724" width="857px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="278" x="288.125" y="35.1074">SyncEngine.Merge: one item of a sync file</text><ellipse cx="507.25" cy="59.6211" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="35.9609" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="200" x="407.25" y="89.6211"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="180" x="417.25" y="112.5703">file item (Id = its SyncId in the file)</text><polygon fill="#F1F1F1" points="428.25,145.582,586.25,145.582,598.25,157.582,586.25,169.582,428.25,169.582,416.25,157.582,428.25,145.582" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="158" x="428.25" y="162.5508">cached item with that SyncId?</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="17" x="399.25" y="154.5703">yes</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="14" x="598.25" y="154.5703">no</text><rect fill="#F1F1F1" height="51.9219" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="236" x="172" y="179.582"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="125" x="182" y="202.5313">reuse the cached object</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="216" x="182" y="218.4922">(keeps tree identity: expansion, selection)</text><polygon fill="#F1F1F1" points="129.5,251.5039,450.5,251.5039,462.5,263.5039,450.5,275.5039,129.5,275.5039,117.5,263.5039,129.5,251.5039" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="321" x="129.5" y="268.4727">source.AllowSave and cached.LastChange &gt; file.LastChange?</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="17" x="100.5" y="260.4922">yes</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="14" x="462.5" y="260.4922">no</text><rect fill="#F1F1F1" height="51.9219" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="193" x="11" y="285.5039"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="130" x="21" y="308.4531">keep the cached content</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="173" x="21" y="324.4141">(a local edit not written back yet)</text><rect fill="#F1F1F1" height="67.8828" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="208" x="368.5" y="285.5039"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="127" x="378.5" y="308.4531">copy title, content, tags,</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="188" x="378.5" y="324.4141">shortcuts, paste mode, LastChange,</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="149" x="378.5" y="340.375">unknown fields from the file</text><polygon fill="#F1F1F1" points="290,359.3867,302,371.3867,290,383.3867,278,371.3867,290,359.3867" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="51.9219" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="236" x="606.5" y="179.582"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="216" x="616.5" y="202.5313">new Template/Folder with a fresh app Id,</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="109" x="616.5" y="218.4922">content from the file</text><polygon fill="#F1F1F1" points="507.25,389.3867,519.25,401.3867,507.25,413.3867,495.25,401.3867,507.25,389.3867" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="35.9609" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="133" x="440.75" y="433.3867"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="113" x="450.75" y="456.3359">SyncId = file item's Id</text><rect fill="#F1F1F1" height="35.9609" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="190" x="412.25" y="489.3477"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="170" x="422.25" y="512.2969">merge its children the same way</text><rect fill="#F1F1F1" height="51.9219" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="277" x="368.75" y="545.3086"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="257" x="378.75" y="568.2578">SyncChildren: remove items no longer in the file,</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="210" x="378.75" y="584.2188">insert new ones, move to the file's order</text><path d="M538.25,607.2305 L538.25,656.1133 L518.25,660.1133 L538.25,664.1133 L538.25,712.9961 A0,0 0 0 0 538.25,712.9961 L845.25,712.9961 A0,0 0 0 0 845.25,712.9961 L845.25,617.2305 L835.25,607.2305 L538.25,607.2305 A0,0 0 0 0 538.25,607.2305 " fill="#FFF8DC" style="stroke:#C8B560;stroke-width:0.5;"/><path d="M835.25,607.2305 L835.25,617.2305 L845.25,617.2305 L835.25,607.2305 " fill="#FFF8DC" style="stroke:#C8B560;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="278" x="544.25" y="625.1797">The folder root adopts the file root's LastChange and</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="108" x="544.25" y="641.1406">unknown fields, so a</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="267" x="544.25" y="657.1016">read-only open re-serializes identically and doesn't</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="251" x="544.25" y="673.0625">churn the shared file (OneDrive conflict copies).</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="286" x="544.25" y="689.0234">Write-back: BuildFileTree writes items keyed by SyncId</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="278" x="544.25" y="704.9844">(new local items get a fresh SyncId), root title "Root".</text><ellipse cx="507.25" cy="660.1133" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="507.25" cy="660.1133" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="507.25" x2="507.25" y1="69.6211" y2="89.6211"/><polygon fill="#444444" points="503.25,79.6211,507.25,89.6211,511.25,79.6211,507.25,83.6211" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="117.5" x2="107.5" y1="263.5039" y2="263.5039"/><line style="stroke:#444444;stroke-width:1.0;" x1="107.5" x2="107.5" y1="263.5039" y2="285.5039"/><polygon fill="#444444" points="103.5,275.5039,107.5,285.5039,111.5,275.5039,107.5,279.5039" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="462.5" x2="472.5" y1="263.5039" y2="263.5039"/><line style="stroke:#444444;stroke-width:1.0;" x1="472.5" x2="472.5" y1="263.5039" y2="285.5039"/><polygon fill="#444444" points="468.5,275.5039,472.5,285.5039,476.5,275.503