<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="709px" preserveAspectRatio="none" style="width:856px;height:709px;background:#FFFFFF;" version="1.1" viewBox="0 0 856 709" width="856px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="278" x="287.75" y="35.1074">SyncEngine.Merge: one item of a sync file</text><ellipse cx="506.5" cy="59.6211" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="35.9609" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="200" x="406.5" y="89.6211"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="180" x="416.5" y="112.5703">file item (Id = its SyncId in the file)</text><polygon fill="#F1F1F1" points="427.5,145.582,585.5,145.582,597.5,157.582,585.5,169.582,427.5,169.582,415.5,157.582,427.5,145.582" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="158" x="427.5" y="162.5508">cached item with that SyncId?</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="17" x="398.5" y="154.5703">yes</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="14" x="597.5" y="154.5703">no</text><rect fill="#F1F1F1" height="51.9219" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="236" x="172" y="179.582"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="125" x="182" y="202.5313">reuse the cached object</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="216" x="182" y="218.4922">(keeps tree identity: expansion, selection)</text><polygon fill="#F1F1F1" points="129.5,251.5039,450.5,251.5039,462.5,263.5039,450.5,275.5039,129.5,275.5039,117.5,263.5039,129.5,251.5039" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="321" x="129.5" y="268.4727">source.AllowSave and cached.LastChange &gt; file.LastChange?</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="17" x="100.5" y="260.4922">yes</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="14" x="462.5" y="260.4922">no</text><rect fill="#F1F1F1" height="51.9219" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="193" x="11" y="285.5039"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="130" x="21" y="308.4531">keep the cached content</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="173" x="21" y="324.4141">(a local edit not written back yet)</text><rect fill="#F1F1F1" height="67.8828" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="205" x="370" y="285.5039"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="127" x="380" y="308.4531">copy title, content, tags,</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="185" x="380" y="324.4141">shortcuts, paste mode, LastChange</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="65" x="380" y="340.375">from the file</text><polygon fill="#F1F1F1" points="290,359.3867,302,371.3867,290,383.3867,278,371.3867,290,359.3867" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="51.9219" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="236" x="605" y="179.582"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="216" x="615" y="202.5313">new Template/Folder with a fresh app Id,</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="109" x="615" y="218.4922">content from the file</text><polygon fill="#F1F1F1" points="506.5,389.3867,518.5,401.3867,506.5,413.3867,494.5,401.3867,506.5,389.3867" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="35.9609" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="133" x="440" y="433.3867"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="113" x="450" y="456.3359">SyncId = file item's Id</text><rect fill="#F1F1F1" height="35.9609" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="190" x="411.5" y="489.3477"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="170" x="421.5" y="512.2969">merge its children the same way</text><rect fill="#F1F1F1" height="51.9219" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="277" x="368" y="545.3086"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="257" x="378" y="568.2578">SyncChildren: remove items no longer in the file,</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="210" x="378" y="584.2188">insert new ones, move to the file's order</text><path d="M537.5,607.2305 L537.5,648.1328 L517.5,652.1328 L537.5,656.1328 L537.5,697.0352 A0,0 0 0 0 537.5,697.0352 L844.5,697.0352 A0,0 0 0 0 844.5,697.0352 L844.5,617.2305 L834.5,607.2305 L537.5,607.2305 A0,0 0 0 0 537.5,607.2305 " fill="#FFF8DC" style="stroke:#C8B560;stroke-width:0.5;"/><path d="M834.5,607.2305 L834.5,617.2305 L844.5,617.2305 L834.5,607.2305 " fill="#FFF8DC" style="stroke:#C8B560;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="282" x="543.5" y="625.1797">The folder root adopts the file root's LastChange, so a</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="267" x="543.5" y="641.1406">read-only open re-serializes identically and doesn't</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="251" x="543.5" y="657.1016">churn the shared file (OneDrive conflict copies).</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="286" x="543.5" y="673.0625">Write-back: BuildFileTree writes items keyed by SyncId</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="278" x="543.5" y="689.0234">(new local items get a fresh SyncId), root title "Root".</text><ellipse cx="506.5" cy="652.1328" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="506.5" cy="652.1328" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="506.5" x2="506.5" y1="69.6211" y2="89.6211"/><polygon fill="#444444" points="502.5,79.6211,506.5,89.6211,510.5,79.6211,506.5,83.6211" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="117.5" x2="107.5" y1="263.5039" y2="263.5039"/><line style="stroke:#444444;stroke-width:1.0;" x1="107.5" x2="107.5" y1="263.5039" y2="285.5039"/><polygon fill="#444444" points="103.5,275.5039,107.5,285.5039,111.5,275.5039,107.5,279.5039" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="462.5" x2="472.5" y1="263.5039" y2="263.5039"/><line style="stroke:#444444;stroke-width:1.0;" x1="472.5" x2="472.5" y1="263.5039" y2="285.5039"/><polygon fill="#444444" points="468.5,275.5039,472.5,285.5039,476.5,275.5039,472.5,279.5039" style="stroke:#444444;stroke-width:1.0;"/><line style="stroke:#444444;stroke-width:1.0;" x1="107.5" x2="107.5" y1="337.4258" y2="371.3867"/><line style="stroke:#444444;stroke-width:1.0;" x1="107.5" x2="278" y1="371.3867" y2="3